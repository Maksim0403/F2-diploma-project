openapi: 3.0.3

info:
  title: Pet Care API
  description: >
    REST API for managing pets in the Pet Care system.
    The API is exposed by the Backend API Gateway
    and consumed by the Frontend SPA.
  version: 1.0.0

servers:
  - url: /api/v1
    description: Backend API

tags:
  - name: Pets
    description: Operations for managing pets

security:
  - BearerAuth: []

paths:
  /pets:
    get:
      tags:
        - Pets
      summary: Get pets
      description: >
        Returns a paginated list of pets available
        to the authenticated user according to access permissions.
      operationId: getPets
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of records to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

        - name: offset
          in: query
          required: false
          description: Number of records to skip.
          schema:
            type: integer
            minimum: 0
            default: 0

      responses:
        '200':
          description: Pets successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetListResponse'

        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '429':
          description: Rate limit exceeded.
          headers:
            Retry-After:
              description: Number of seconds before retrying.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '503':
          description: Service temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Pets
      summary: Create a pet
      description: >
        Creates a new pet for the authenticated user.
        The owner identifier is obtained from the JWT token.
      operationId: createPet

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePetRequest'

      responses:
        '201':
          description: Pet successfully created.
          headers:
            Location:
              description: URI of the created pet.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetResponse'

        '400':
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '409':
          description: A pet with the specified microchip already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

        '429':
          description: Rate limit exceeded.
          headers:
            Retry-After:
              description: Number of seconds before retrying.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '503':
          description: Service temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pets/{petId}:
    get:
      tags:
        - Pets
      summary: Get pet by ID
      description: >
        Returns information about a specific pet.
        Access is checked using the authenticated user's permissions.
      operationId: getPetById

      parameters:
        - name: petId
          in: path
          required: true
          description: Unique identifier of the pet.
          schema:
            type: string
            format: uuid

      responses:
        '200':
          description: Pet successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PetResponse'

        '400':
          description: Invalid pet identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          description: Authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '403':
          description: The user does not have access to this pet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Pet not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '429':
          description: Rate limit exceeded.
          headers:
            Retry-After:
              description: Number of seconds before retrying.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '503':
          description: Service temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT access token obtained during authentication.

  schemas:
    CreatePetRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - species
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Pet name.

        species:
          type: string
          enum:
            - dog
            - cat
            - other
          description: Pet species.

        breed:
          type: string
          maxLength: 100
          nullable: true
          description: Pet breed.

        birthDate:
          type: string
          format: date
          nullable: true
          description: Pet date of birth.

        sex:
          type: string
          enum:
            - male
            - female
            - unknown
          default: unknown
          description: Pet sex.

        microchipId:
          type: string
          minLength: 1
          maxLength: 50
          nullable: true
          description: Microchip identifier.

    PetResponse:
      type: object
      required:
        - id
        - name
        - species
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid

        name:
          type: string

        species:
          type: string
          enum:
            - dog
            - cat
            - other

        breed:
          type: string
          nullable: true

        birthDate:
          type: string
          format: date
          nullable: true

        sex:
          type: string
          enum:
            - male
            - female
            - unknown

        microchipId:
          type: string
          nullable: true

        createdAt:
          type: string
          format: date-time

        updatedAt:
          type: string
          format: date-time

    PetListResponse:
      type: object
      required:
        - items
        - limit
        - offset
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PetResponse'

        limit:
          type: integer
          minimum: 1

        offset:
          type: integer
          minimum: 0

        total:
          type: integer
          minimum: 0

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code.
          example: PET_NOT_FOUND

        message:
          type: string
          description: Human-readable error description.

        traceId:
          type: string
          description: Identifier used for request tracing.

    ValidationErrorResponse:
      type: object
      required:
        - code
        - message
        - errors
      properties:
        code:
          type: string
          example: VALIDATION_ERROR

        message:
          type: string
          example: Request validation failed.

        errors:
          type: array
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
                example: name

              message:
                type: string
                example: Field must not be empty.

        traceId:
          type: string